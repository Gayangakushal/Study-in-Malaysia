<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="assets/favicon.png"><link rel="apple-touch-icon" href="assets/favicon.png"><title>Thank You | SITC Campus</title><style>body{margin:0;background:#f2f6fc;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;color:#06275f}.card{background:white;max-width:520px;margin:20px;padding:45px 30px;text-align:center;border-radius:22px;box-shadow:0 15px 50px #06275f18}h1{font-size:38px}p{line-height:1.7}a{display:inline-block;background:#0ca446;color:white;text-decoration:none;border-radius:30px;padding:15px 25px;font-weight:bold}.muted{font-size:12px;color:#667}</style></head><body><div class="card"><div style="font-size:55px">✓</div><h1 id="title">Thank you!</h1><p>An SITC counsellor will contact you shortly.</p><a id="wa" href="#">Continue on WhatsApp now</a><p class="muted">Configure the official SITC WhatsApp number before publishing.</p></div><script>const number='';const name=sessionStorage.getItem('sitc_lead_name')||'';const programme=sessionStorage.getItem('sitc_lead_programme')||'';if(name)document.getElementById('title').textContent='Thank you, '+name+'!';const a=document.getElementById('wa');if(number){a.href='https://wa.me/'+number+'?text='+encodeURIComponent('Hello, I am '+name+'. I am interested in '+programme+'.');}else{a.onclick=e=>{e.preventDefault();alert('Official WhatsApp number is not configured yet.')}};</script></body></html>
